name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v prefix (for example 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate version
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 1.2.3"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ inputs.version }}" >/dev/null; then
            echo "Tag v${{ inputs.version }} already exists"; exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm version "${{ inputs.version }}" --no-git-tag-version
      - run: npm run build
      - name: Commit build output to a release tag and the release branch
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git checkout --detach
          git add package.json package-lock.json
          git add --force dist
          git commit -m "Release v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
          git push --force origin "HEAD:refs/heads/release"
